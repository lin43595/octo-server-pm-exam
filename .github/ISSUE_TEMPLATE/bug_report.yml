name: Bug Report
description: 反馈 octo-server 相关问题
title: "[Bug] "
labels: ["type/bug", "status/triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 用户遇到了什么问题？
      placeholder: 请描述现象、影响范围、发生位置
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 如何复现？
      placeholder: |
        1.
        2.
        3.
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      description: 用户期望看到什么？
    validations:
      required: false

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 实际发生了什么？
    validations:
      required: false

  - type: textarea
    id: impact
    attributes:
      label: 影响范围
      description: 影响哪些用户、模块或流程？
    validations:
      required: false

  - type: textarea
    id: evidence
    attributes:
      label: 证据和上下文
      description: 截图、日志、源码引用、相关路径
    validations:
      required: false
